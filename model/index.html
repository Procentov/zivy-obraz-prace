const H_ZIVE = 72, H_PROJ = 14*24;
const e = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const kdy = h => h < 1 ? "před chvílí" : h < 24 ? `před ${Math.round(h)} h` : `před ${Math.round(h/24)} dny`;
const znak = st => ({hotovo:"✔",bezi:"⏳",probiha:"⏳",rozpracovano:"⏳",blokovano:"⚠",blokator:"⚠",odlozeno:"☐"})[st] || "☐";
const slovo = st => ({hotovo:"hotovo",bezi:"běží",probiha:"běží",rozpracovano:"rozpracováno",blokovano:"blokátor",blokator:"blokátor",odlozeno:"odloženo",ceka:"čeká na řadu"})[st] || "čeká na řadu";
const faze = a => !a ? "Úkol nemá otevřený krok" : a.faze === "hledame" ? "◀ Do kopce: hledáme" : a.faze === "delame" ? "▶ Z kopce: děláme" : "Fáze nezapsaná";
const tah = k => k.na_tahu_mirek && k.na_tahu_mirek.length ? "👉 Na tahu jsi ty" : "Na tebe nic nečeká";
const K = DATA.karty;
const proj = {};
K.forEach(k => { (proj[k.projekt] ||= []).push(k); });
const projekty = Object.entries(proj).map(([n, ks]) => ({n, ks, h: Math.min(...ks.map(k => k.hodin_od_zmeny)), ty: ks.filter(k => k.na_tahu_mirek?.length).length, zive: ks.filter(k => k.hodin_od_zmeny <= H_ZIVE)})).sort((a,b) => a.h - b.h);
const app = document.getElementById("app");
const pozn = `<div class="drat">Drátěný model k odsouhlasení · ostrá data z karet ${e(new Date(DATA.vytazeno).toLocaleString("cs-CZ",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"}))} · rozdělení do projektů je zatím moje (na kartách je pole projekt nejednotné)</div>`;
const leg = (extra="") => `<div class="leg">Legenda: <span>✔ hotovo</span><span>⏳ běží</span><span>☐ čeká na řadu</span><span>⚠ blokátor</span><span>▶ jsme tady (tlustý rám)</span><span>👉 na tahu jsi ty (oranžový rám)</span><span><span class="zk">zkouška</span> karta ze studeného startu</span>${extra}</div>`;

function firma(){
  const d24 = K.filter(k => k.hodin_od_zmeny <= 24);
  const ty = K.filter(k => k.na_tahu_mirek?.length);
  const ziveP = projekty.filter(p => p.h <= H_PROJ), spiP = projekty.filter(p => p.h > H_PROJ);
  const dlazP = p => `<a class="dl${p.ty ? " tyb" : ""}" href="#p-${slug(p.n)}"><div class="hl"><span class="pik">${PIK[p.n]||"📁"}</span><span>${e(p.n)}</span></div>
    <div class="r"><span class="lbl">Pohnulo se:</span> ${kdy(p.h)}</div>
    <div class="r"><span class="lbl">V pohybu:</span> ${p.zive.length} z ${p.ks.length} úkolů</div>
    ${p.ty ? `<div class="r">👉 Na tahu jsi ty: ${p.ty}×</div>` : ""}
    ${p.zive.length ? `<div class="r"><span class="lbl">Teď se řeší:</span><ul>${p.zive.slice(0,3).map(k => `<li>${e(k.titulek)}</li>`).join("")}</ul></div>` : ""}</a>`;
  app.innerHTML = pozn + `<div class="cesta"><b>🏢 Firma</b></div><h1>Co se ve firmě hýbe</h1>
  <div class="pruh0"><div><span class="lbl">Za posledních 24 h se pohnulo:</span> ${d24.length} úkolů v ${new Set(d24.map(k=>k.projekt)).size} projektech</div>
  <div${ty.length ? ' class="ty" style="padding:4px 6px;border-radius:6px"' : ""}><span class="lbl">Na tahu jsi ty:</span> ${ty.length ? ty.map(k => `<a href="#k-${e(k.id)}">${e(k.titulek)}</a>`).join(", ") : "nic"}</div></div>
  <div class="mrizka">${ziveP.map(dlazP).join("")}</div>
  ${spiP.length ? `<details class="sbal"><summary>Spící projekty (${spiP.length}) — dva týdny bez pohybu</summary><div class="mrizka spi">${spiP.map(dlazP).join("")}</div></details>` : ""}
  <h2>Pět karet ze zkoušky</h2>${K.filter(k=>k.test5).map(k => `<a class="radek" href="#k-${e(k.id)}"><span>${e(k.piktogram||"📄")}</span><span class="k">${e(k.titulek)}</span><span class="c">${e(k.projekt)}</span></a>`).join("")}
  ${leg()}`;
}

function dlazK(k){
  return `<a class="dl${k.na_tahu_mirek?.length ? " tyb" : ""}" href="#k-${e(k.id)}"><div class="hl"><span class="pik">${e(k.piktogram||"📄")}</span><span>${e(k.titulek)}${k.test5 ? '<span class="zk">zkouška</span>' : ""}</span></div>
  <div class="r">${e(k.o_cem)}</div>
  <div class="r"><span class="lbl">Fáze:</span> ${faze(k.aktualni)}</div>
  <div class="r"><span class="lbl">Krok:</span> ${k.hotovo} z ${k.kroku} hotovo${k.aktualni ? " · teď " + e(k.aktualni.nazev) : ""}</div>
  <div class="r">${tah(k)} · <span class="lbl">pohnulo se ${kdy(k.hodin_od_zmeny)}</span></div></a>`;
}

function projekt(n){
  const p = projekty.find(x => slug(x.n) === n); if (!p) return firma();
  const zive = p.ks.filter(k => k.hodin_od_zmeny <= H_ZIVE), stoji = p.ks.filter(k => k.hodin_od_zmeny > H_ZIVE);
  const zkStoji = stoji.filter(k => k.test5), ost = stoji.filter(k => !k.test5);
  app.innerHTML = pozn + `<div class="cesta"><a href="#firma">🏢 Firma</a> › <b>${PIK[p.n]||"📁"} ${e(p.n)}</b></div><h1>${e(p.n)}</h1>
  <div class="pruh0"><div><span class="lbl">Řeší se:</span> ${zive.length ? zive.slice(0,3).map(k=>e(k.titulek)).join(" · ") : "nic za poslední 3 dny"}</div>
  <div><span class="lbl">Pohnulo se:</span> ${kdy(p.h)} · <span class="lbl">úkolů celkem:</span> ${p.ks.length}</div>
  <div${p.ty ? ' class="ty" style="padding:4px 6px;border-radius:6px"' : ""}><span class="lbl">Na tahu jsi ty:</span> ${p.ty ? p.ty + "×" : "nic"}</div></div>
  <div class="chyb">Cíl projektu a proč vznikl: na kartách zatím nezapsané — doplní se v ostré verzi.</div>
  <h2>V pohybu (poslední 3 dny)</h2>${zive.length ? `<div class="mrizka">${zive.map(dlazK).join("")}</div>` : '<div class="chyb">Nic.</div>'}
  ${zkStoji.length ? `<h2>Ze zkoušky (stojí déle než 3 dny)</h2><div class="mrizka">${zkStoji.map(dlazK).join("")}</div>` : ""}
  ${ost.length ? `<details class="sbal"><summary>Stojí déle než 3 dny (${ost.length})</summary>${ost.map(k => `<a class="radek" href="#k-${e(k.id)}"><span>${e(k.piktogram||"📄")}</span><span class="k">${e(k.titulek)}</span><span class="c">${kdy(k.hodin_od_zmeny)}</span></a>`).join("")}</details>` : ""}
  ${leg()}`;
}

function ukol(id){
  const k = K.find(x => x.id === id); if (!k) return firma();
  const p = k.projekt, kroky = k.kroky || [], kopec = (k.kopec && k.kopec.length) ? k.kopec : (kroky.length ? [{cast:"Kroky úkolu", kroky: kroky.map(s=>s.id)}] : []);
  const zaraz = new Set(kopec.flatMap(c => c.kroky.map(String)));
  const zbyle = kroky.filter(s => !zaraz.has(s.id));
  if (zbyle.length) kopec.push({cast:"Ostatní kroky", kroky: zbyle.map(s=>s.id)});
  const akt = k.aktualni?.id;
  const vetev = c => {
    const ss = c.kroky.map(i => kroky.find(s => s.id === String(i))).filter(Boolean);
    const tady = ss.some(s => s.id === akt), vse = ss.length && ss.every(s => s.stav === "hotovo");
    const z = vse ? "✔" : tady ? "⏳" : "☐";
    return `<li><details class="vetev${tady ? " tady" : ""}"${tady ? " open" : ""}><summary><span>${z}</span><span>${e(c.cast)}${tady ? " — ▶ jsme tady" : ""}</span><span class="c" style="margin-left:auto;font-size:13px;color:var(--soft)">${ss.filter(s=>s.stav==="hotovo").length}/${ss.length}</span></summary>
      <ul class="listy">${ss.map(s => `<li class="${s.id===akt?"tady":""}">${s.id===akt?"▶ ":""}${znak(s.stav)} ${e(s.nazev)} <span style="color:var(--soft);font-size:13px">· ${slovo(s.stav)}${s.faze==="hledame"?" · hledáme":s.faze==="delame"?" · děláme":""}</span>
        ${(k.odbocky||[]).filter(o => String(o.z)===s.id).map(o => `<span class="odb">↳ odbočka: ${e(o.co)} — ${o.konec==="vracena"?"vrátili jsme se":o.konec==="slepa"?"✖ slepá":"➡ nový úkol "+e(o.ukol||"")}</span>`).join("")}</li>`).join("")}</ul></details></li>`;
  };
  app.innerHTML = pozn + `<div class="cesta"><a href="#firma">🏢 Firma</a> › <a href="#p-${slug(p)}">${PIK[p]||"📁"} ${e(p)}</a> › <b>${e(k.piktogram||"📄")} úkol</b></div>
  <h1>${e(k.piktogram||"")} ${e(k.titulek)}${k.test5 ? '<span class="zk">zkouška</span>' : ""}</h1>
  <div class="pruh0${k.na_tahu_mirek?.length ? " ty" : ""}"><div><span class="lbl">Fáze:</span> <b>${faze(k.aktualni)}</b></div>
  <div><span class="lbl">Jsme u:</span> ${k.aktualni ? e(k.aktualni.nazev) : "úkol nemá otevřený krok"} · ${k.hotovo} z ${k.kroku} kroků hotovo</div>
  <div>${tah(k)} · <span class="lbl">pohnulo se ${kdy(k.hodin_od_zmeny)}</span></div></div>
  <div class="tri"><div><span class="lbl">O čem:</span> ${e(k.o_cem) || '<span class="chyb">nezapsáno</span>'}</div>
  ${k.bolest !== undefined ? `<div><span class="lbl">Proč:</span> ${e(k.bolest) || '<span class="chyb">nezapsáno</span>'}</div>` : ""}
  <div><span class="lbl">Kam:</span> ${e(k.cil) || '<span class="chyb">nezapsáno</span>'}</div>
  <div><span class="lbl">Podle čeho poznáme hotovo:</span> ${k.kriterii} kritérií</div></div>
  <h2>Strom úkolu — co vzniká a kde jsme</h2>
  ${kroky.length ? `<div class="koren">🎯 Cíl: ${e(k.cil)}</div><ul class="vetve">${kopec.map(vetev).join("")}</ul>` : '<div class="chyb">Strom se u úkolu bez pohybu v modelu nekreslí; v ostré verzi bude u každého.</div>'}
  <p class="chyb" style="margin-top:14px">Myšlenky z rozhovorů (co padlo, co jsme zavrhli) se sem připojí z karty 213, která je sbírá.</p>
  ${k.posledni_pohyb ? `<details class="sbal"><summary>Poslední zápis na kartě (zatím surový)</summary><p class="surove">${e(k.posledni_pohyb)}</p></details>` : ""}
  ${leg('<span>↳ odbočka</span><span>✖ slepá</span>')}`;
}

function route(){
  const h = location.hash.slice(1);
  if (h.startsWith("p-")) projekt(h.slice(2));
  else if (h.startsWith("k-")) ukol(h.slice(2));
  else firma();
  window.scrollTo(0,0);
}
addEventListener("hashchange", route); route();
</script>
</body>
</html>
